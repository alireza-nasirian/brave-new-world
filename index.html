<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brave New World</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #070810;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
    }

    /* ── Persistent UI chrome ─────────────────────────────────────────────── */
    #title {
      position: fixed;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.72);
      font-family: 'Georgia', serif;
      font-size: 28px;
      font-weight: normal;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      pointer-events: none;
      white-space: nowrap;
      text-shadow:
        0 0 40px rgba(220, 60, 60, 0.55),
        0 0 80px rgba(220, 60, 60, 0.25);
      z-index: 10;
    }

    /* ── Story overlay ────────────────────────────────────────────────────── */
    #story-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(7, 8, 16, 0.86);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.9s ease;
      z-index: 100;
    }

    #story-overlay.visible {
      opacity: 1;
      pointer-events: all;
    }

    #story-card {
      max-width: 580px;
      width: 90%;
      text-align: center;
      padding: 0 16px;
    }

    #story-act {
      font-family: 'Georgia', serif;
      font-size: 11px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(180, 60, 60, 0.7);
      margin-bottom: 18px;
    }

    #story-title {
      font-family: 'Georgia', serif;
      font-size: 32px;
      font-weight: normal;
      color: #cc3333;
      letter-spacing: 0.08em;
      margin-bottom: 28px;
      line-height: 1.2;
      text-shadow: 0 0 30px rgba(200, 50, 50, 0.5);
    }

    #story-body {
      font-family: 'Georgia', serif;
      font-size: 16px;
      line-height: 1.85;
      color: rgba(220, 215, 210, 0.82);
      letter-spacing: 0.03em;
      margin-bottom: 44px;
      white-space: pre-line;
    }

    #story-cta {
      font-family: 'Georgia', serif;
      font-size: 17px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.78);
      text-shadow:
        0 0 12px rgba(255, 255, 255, 0.35),
        0 0 26px rgba(210, 70, 70, 0.35);
      animation: ctaPulse 2.2s ease-in-out infinite;
    }

    @keyframes ctaPulse {
      0%, 100% { opacity: 0.7; }
      50%       { opacity: 1; }
    }

    /* Progress dots */
    #story-progress {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 32px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(180, 60, 60, 0.25);
      transition: background 0.4s ease;
    }

    .dot.filled {
      background: rgba(200, 60, 60, 0.75);
    }
  </style>
</head>
<body>
  <div id="title">Brave New World</div>

  <!-- Story overlay -->
  <div id="story-overlay">
    <div id="story-card">
      <div id="story-act"></div>
      <h2 id="story-title"></h2>
      <div id="story-progress"></div>
      <p id="story-body"></p>
      <p id="story-cta"></p>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/addons/p5.sound.min.js"></script>
  <script src="particle.js"></script>
  <script src="regularParticle.js"></script>
  <script src="soloParticle.js"></script>
  <script src="sketch.js"></script>

  <script>
    // ── Story acts ────────────────────────────────────────────────────────────
    // Each act: { act, title, body, cta }
    const ACTS = [
      {
        act: 'prologue',
        title: 'Brave New World',
        body: `Music: The lonely Shepherd by James Last Orchestra.

This artwork was inspired by the book "Brave New World" by Aldous Huxley, which explores a dystopian future where human connections are brief and superficial.

In this world no one is sad or stress or "alone". If you feel bad you can take a pill and will make you happy again.

There are no limitations in the relationships, couples don't exist, because everyone can be with everyone else. You don't have to hold back your sexual desires.

In this world, "love" doesn't exist, or at least, the definition of "love" we have today.

Families don't exist, people is created in labs. The feeling of motherhood, fatherhood or brotherhood doesn't exist.

Hope is always there...`,
        cta: '— click or press space to reach out —'
      },
      {
        act: 'act I',
        title: 'The idea behind...',
        body: `Nowadays relationships are more and more difficult to find.

There are a lot of people just wanting to live the moment, where love is ephemeral, and connections are weak.

People jumping from one relationship to another. The first moment they see a little of commitment, they choose to leave.

However, there are still people wanting to create a real bond with someone else, with a person to share the life with.

And of course life is not perfect like in the movies, good days will come as well as bad days.

But that's where the challenge lies, to keep fighting, to be consistent.

Because we believe in a better world...`,
        cta: '— click or press space to try again —'
      },
      {
        act: 'act II',
        title: 'The red point...',
        body: `That red point, red square, it can be anyone, struggling in life, trying to find a real connection, a person to grow with.

Trying to be themselves and to find the right group that will accept them.

In the meantime, life continues, don't stress, there is always one person for everyone.`,
        cta: '— click or press space — one more time —'
      },
      {
        act: 'act III',
        title: 'Family and friends...',
        body: `Being in a couple is not the only way to create a bond with someone. Family and friends are also important.

Try to surround yourself with the people that really cares about you. It's not only in the good moments, but also in the bad moments.

we believe that everyone deserves to be loved...`,
        cta: '— click or press space to reach out again —'
      },
      {
        act: 'epilogue',
        title: 'A Brave New World.',
        body: `Look at them. They swap and reform without hesitation — two particles that were strangers a moment ago, now orbiting each other like they were always meant to.


Instead of creating 1000 momories with 1000 different people, I choose to have 1000 memories with the same person.

And that moment will arrive, just be prepared.

Good luck.`,
        cta: '— click or press space — last chance —'
      }
    ];

    // ── Game state ────────────────────────────────────────────────────────────
    let round = 0;
    const MAX_ROUNDS = 4; // after 5 breakups → final act
    const INTERACTIONS_PER_ACT = 3;    // show poster every 5 breakups
    let interactionCount = 0;          // total of accumulated breakups

    const overlay  = document.getElementById('story-overlay');
    const elAct    = document.getElementById('story-act');
    const elTitle  = document.getElementById('story-title');
    const elProg   = document.getElementById('story-progress');
    const elBody   = document.getElementById('story-body');
    const elCta    = document.getElementById('story-cta');

    // Build progress dots (one per breakup round)
    function buildDots() {
      elProg.innerHTML = '';
      for (let i = 0; i < MAX_ROUNDS; i++) {
        const d = document.createElement('div');
        d.className = 'dot' + (i < round ? ' filled' : '');
        elProg.appendChild(d);
      }
    }

    function showAct(index) {
      window.storyInteractionBlocked = true;
      const act = ACTS[Math.min(index, ACTS.length - 1)];

      elAct.textContent   = act.act;
      elTitle.textContent = act.title;
      elBody.textContent  = act.body;
      elCta.textContent   = act.cta;
      buildDots();

      // Hide progress dots on intro and epilogue (no dots needed)
      elProg.style.display = (index === 0 || index >= MAX_ROUNDS) ? 'none' : 'flex';

      overlay.classList.add('visible');
    }

    function dismissAct() {
      overlay.classList.remove('visible');

      // Wait for fade-out before unblocking interaction
      setTimeout(() => {
        window.storyInteractionBlocked = false;

        if (round > MAX_ROUNDS) {
          // Restart everything after epilogue
          round = 0;
          interactionCount = 0;
          if (typeof window.restartSketch === 'function') window.restartSketch();
          setTimeout(() => showAct(0), 200);
        }
      }, 950);
    }

    // ── Sketch callbacks ──────────────────────────────────────────────────────
    window.onSoloBond = function () {
      // Could be used for future bonding-specific narration
    };

    window.onSoloBreakup = function () {
      interactionCount++;

      // Show act only every N interactions
      if (interactionCount % INTERACTIONS_PER_ACT === 0) {
        round++;
      
        // if round <= MAX_ROUNDS, show the corresponding act
        // if already passed, show the epilogue
        setTimeout(() => {
          showAct(round <= MAX_ROUNDS ? round : MAX_ROUNDS);
        }, 1400);
      }
    };

    // ── Input capture ─────────────────────────────────────────────────────────
    // When overlay is visible, click / space dismiss it instead of triggering sketch
    document.addEventListener('click', function () {
      if (window.storyInteractionBlocked) dismissAct();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === ' ' && window.storyInteractionBlocked) {
        e.preventDefault();
        dismissAct();
      }
    });

    // ── Boot: show intro after p5 has had a moment to start ──────────────────
    // storyInteractionBlocked starts true so the sketch won't respond before intro
    window.storyInteractionBlocked = true;
    window.addEventListener('load', function () {
      setTimeout(() => showAct(0), 600);
    });
  </script>
</body>
</html>
